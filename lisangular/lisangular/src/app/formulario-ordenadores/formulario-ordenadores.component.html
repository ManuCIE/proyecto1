<form>
    <div class="mb-3">
        <label for="modelo" class="form-label">MODELO: </label>
        <input type="text" class="form-control" id="modelo" name="modelo" [(ngModel)]="ordenador.modelo"
            placeholder="Ingrese el MODELO" required />
    </div>
    <div class="mb-3">
        <label for="marca" class="form-label">MARCA: </label>
        <input type="text" class="form-control" id="marca" name="marca" [(ngModel)]="ordenador.marca"
            placeholder="Ingrese el MARCA: " required />
    </div>

    <div class="mb-3">
        <label for="precio" class="form-label">PRECIO: </label>
        <input type="number" class="form-control" id="precio" name="precio" [(ngModel)]="ordenador.precio"
            placeholder="Importe €: " required />
    </div>

    <div class="mb-3">
        <label for="numserie" class="form-label">Nº Serie</label>
        <input type="string" class="form-control" id="numserie" name="numserie" [(ngModel)]="ordenador.numserie"
            placeholder="XX-00000X" required />
    </div>

    <div class="d-flex justify-content-between">
        <a routerLink="/lista-ordenadores"> Inicio 🏠</a>
        <button type="submit" class="btn btn-info" (click)="insertar()">Guardar</button>
        <button type="reset" class="btn btn-secondary">Limpiar</button>

    </div>


</form>
